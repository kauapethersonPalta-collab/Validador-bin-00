<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Validador BIN</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0f172a;
  color:#f8fafc;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{
  max-width:520px;
  margin:auto;
  padding:24px 18px 40px
}

.logo{
  text-align:center;
  font-size:42px;
  margin:12px 0
}

h1{
  text-align:center;
  margin:0 0 6px;
  font-size:28px
}

.sub{
  text-align:center;
  color:#94a3b8;
  margin-bottom:24px
}

.box,.result{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px
}

label{
  display:block;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:8px
}

.form{
  display:flex;
  gap:9px
}

input{
  min-width:0;
  flex:1;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:18px;
  background:#0f172a;
  color:white;
  outline:none
}

button{
  border:0;
  border-radius:12px;
  padding:0 17px;
  font-weight:700;
  background:#fff;
  color:#111827
}

button:active{
  transform:scale(.97)
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:12px 0;
  border-bottom:1px solid #334155
}

.row:last-child{
  border-bottom:0
}

.row span{
  color:#94a3b8
}

.row strong{
  text-align:right
}

.status{
  padding:14px;
  border-radius:13px;
  margin-top:15px;
  background:#334155;
  line-height:1.5
}

.status b{
  display:block;
  margin-bottom:7px
}

.note{
  font-size:13px;
  color:#94a3b8;
  line-height:1.5;
  margin-top:15px
}

.error{
  color:#fecaca
}

.small{
  font-size:12px;
  color:#64748b;
  margin-top:16px;
  text-align:center
}
</style>
</head>

<body>

<main class="app">

<div class="logo">💳</div>

<h1>Validador de BIN</h1>

<div class="sub">
Consulta informações públicas da BIN
</div>

<section class="box">

<label for="bin">BIN do cartão</label>

<div class="form">

<input
id="bin"
inputmode="numeric"
maxlength="8"
placeholder="Ex.: 424242"
autocomplete="off">

<button id="go">
Consultar
</button>

</div>

</section>

<section id="output"></section>

<div class="small">
Não informe número completo, validade, CVV ou código SMS.
</div>

</main>

<script>

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "Não informado")
    .replace(/[&<>"']/g,m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));
}

async function consult(){

  const bin = $("bin").value.replace(/\D/g,"");

  if(bin.length < 6 || bin.length > 8){

    $("output").innerHTML =
      '<div class="result error">Digite uma BIN com 6 a 8 números.</div>';

    return;
  }

  $("output").innerHTML =
    '<div class="result">Consultando BIN…</div>';

  try{

    const response = await fetch(
      "https://cardbincheck.com/api/bin/" +
      encodeURIComponent(bin),
      {
        method:"GET",
        headers:{
          "Accept":"application/json"
        }
      }
    );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const json = await response.json();

    if(!json.success || !json.data){
      throw new Error("BIN não encontrada");
    }

    const d = json.data;

    $("output").innerHTML = `

      <div class="result">

        <div class="row">
          <span>BIN</span>
          <strong>${esc(d.bin || bin)}</strong>
        </div>

        <div class="row">
          <span>Bandeira</span>
          <strong>${esc(d.scheme)}</strong>
        </div>

        <div class="row">
          <span>Tipo</span>
          <strong>${esc(d.funding)}</strong>
        </div>

        <div class="row">
          <span>Nível</span>
          <strong>${esc(d.segment)}</strong>
        </div>

        <div class="row">
          <span>Emissor</span>
          <strong>${esc(d.issuer)}</strong>
        </div>

        <div class="row">
          <span>País</span>
          <strong>${esc(d.country_name)}</strong>
        </div>

        <div class="status">

          <b>Apple Wallet</b>

          A BIN, sozinha, não permite determinar
          de forma confiável qual método de verificação
          o emissor oferecerá no Apple Wallet.

        </div>

        <div class="note">

          Os dados acima são informações de BIN.
          Eles não confirmam se um cartão específico
          está ativo, aprovado, desbloqueado ou elegível
          para Apple Pay.

        </div>

      </div>
    `;

  }catch(error){

    console.error(error);

    $("output").innerHTML = `

      <div class="result error">

        Não foi possível consultar essa BIN agora.

        <div class="note">
          Verifique sua conexão ou tente novamente
          em alguns instantes.
        </div>

      </div>
    `;
  }
}

$("go").addEventListener("click",consult);

$("bin").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    consult();
  }
});

</script>

</body>
</html>
