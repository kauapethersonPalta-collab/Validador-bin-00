<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Validador BIN • Apple Pay</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0f172a;
  color:#f8fafc;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{
  max-width:560px;
  margin:auto;
  padding:24px 16px 45px
}

.logo{
  text-align:center;
  font-size:46px;
  margin:8px 0
}

h1{
  text-align:center;
  margin:0;
  font-size:27px
}

.sub{
  text-align:center;
  color:#94a3b8;
  margin:7px 0 24px
}

.box,.card{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px
}

label{
  display:block;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:9px
}

.form{
  display:flex;
  gap:9px
}

input{
  min-width:0;
  flex:1;
  border:1px solid #475569;
  border-radius:13px;
  padding:15px;
  font-size:18px;
  background:#0f172a;
  color:white;
  outline:none
}

button{
  border:0;
  border-radius:13px;
  padding:0 18px;
  font-weight:700;
  font-size:15px;
  background:white;
  color:#111827
}

button:active{
  transform:scale(.97)
}

.title{
  font-size:19px;
  font-weight:800;
  margin-bottom:14px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #334155
}

.row:last-child{
  border-bottom:0
}

.row span{
  color:#94a3b8
}

.row strong{
  text-align:right
}

.methods{
  display:grid;
  gap:10px
}

.method{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border:1px solid #475569;
  border-radius:15px;
  background:#172033
}

.icon{
  width:40px;
  height:40px;
  border-radius:11px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f172a;
  font-size:20px
}

.method-content{
  flex:1
}

.method-name{
  font-weight:800
}

.method-info{
  color:#94a3b8;
  font-size:12px;
  margin-top:3px
}

.badge{
  padding:6px 8px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap
}

.confirmed{
  background:#14532d;
  color:#bbf7d0
}

.notconfirmed{
  background:#713f12;
  color:#fde68a
}

.unknown{
  background:#334155;
  color:#cbd5e1
}

.info{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:#172033;
  color:#cbd5e1;
  font-size:13px;
  line-height:1.5
}

.error{
  color:#fecaca
}

.loading{
  text-align:center;
  color:#cbd5e1
}

.small{
  color:#64748b;
  font-size:12px;
  text-align:center;
  line-height:1.5;
  margin-top:18px
}

@media(max-width:430px){
  .form{
    flex-direction:column
  }

  button{
    height:48px
  }
}
</style>
</head>

<body>

<main class="app">

<div class="logo">💳</div>

<h1>Validador BIN</h1>

<div class="sub">
Consulta de BIN e informações de Apple Pay
</div>

<section class="box">

<label for="bin">Digite a BIN</label>

<div class="form">

<input
 id="bin"
 inputmode="numeric"
 maxlength="8"
 placeholder="Ex.: 424242"
 autocomplete="off">

<button id="go">Consultar</button>

</div>

</section>

<section id="output"></section>

<div class="small">
Use somente BINs de 6 a 8 dígitos.
Não informe número completo de cartão, CVV,
senha ou código SMS.
</div>

</main>

<script>

const $ = id => document.getElementById(id);

/*
====================================================
BASE DE VERIFICAÇÃO
====================================================

IMPORTANTE:

Os registros abaixo são apenas exemplos.

O site NÃO deve afirmar que uma BIN aceita SMS,
aplicativo ou ligação sem uma fonte confiável.

Para adicionar um registro confirmado, use:

{
  bin:"123456",
  applePay:"Sim",
  sms:"Confirmado",
  app:"Não confirmado",
  phone:"Não confirmado",
  source:"Fonte confiável"
}

*/

const verificationDatabase = {

  /*
  Exemplo de estrutura:

  "123456":{
    applePay:"Sim",
    sms:"Confirmado",
    app:"Não confirmado",
    phone:"Não confirmado",
    source:"Fonte/documentação"
  }

  */

};

/*
====================================================
FUNÇÕES
====================================================
*/

function esc(v){

  return String(v ?? "Não informado")
  .replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));

}

function status(value){

  if(value === "Confirmado"){
    return `<span class="badge confirmed">CONFIRMADO</span>`;
  }

  if(value === "Não confirmado"){
    return `<span class="badge notconfirmed">NÃO CONFIRMADO</span>`;
  }

  return `<span class="badge unknown">DESCONHECIDO</span>`;

}

function method(icon,name,value,description){

  return `

    <div class="method">

      <div class="icon">${icon}</div>

      <div class="method-content">

        <div class="method-name">
          ${name}
        </div>

        <div class="method-info">
          ${description}
        </div>

      </div>

      ${status(value)}

    </div>

  `;

}

/*
====================================================
CONSULTA
====================================================
*/

async function consult(){

  const bin =
    $("bin").value.replace(/\D/g,"");

  if(bin.length < 6 || bin.length > 8){

    $("output").innerHTML = `

      <div class="card error">

        Digite uma BIN válida com 6 a 8 números.

      </div>

    `;

    return;
  }

  $("output").innerHTML = `

    <div class="card loading">

      🔎 Consultando BIN...

    </div>

  `;

  try{

    /*
    Consulta informações públicas da BIN.
    */

    const response = await fetch(
      "https://lookup.binlist.net/" +
      encodeURIComponent(bin),
      {
        headers:{
          "Accept-Version":"3"
        }
      }
    );

    if(!response.ok){

      throw new Error(
        "API HTTP " + response.status
      );

    }

    const d = await response.json();

    /*
    Procura a BIN na nossa base de
    informações confirmadas.
    */

    const verification =
      verificationDatabase[bin] || {};

    const applePay =
      verification.applePay || "Desconhecido";

    const sms =
      verification.sms || "Desconhecido";

    const app =
      verification.app || "Desconhecido";

    const phone =
      verification.phone || "Desconhecido";

    const source =
      verification.source ||
      "Nenhuma fonte cadastrada";

    $("output").innerHTML = `

      <div class="card">

        <div class="title">
          📊 Informações da BIN
        </div>

        <div class="row">
          <span>BIN</span>
          <strong>${esc(bin)}</strong>
        </div>

        <div class="row">
          <span>Bandeira</span>
          <strong>${esc(d.scheme)}</strong>
        </div>

        <div class="row">
          <span>Tipo</span>
          <strong>${esc(d.type)}</strong>
        </div>

        <div class="row">
          <span>Banco / emissor</span>
          <strong>${esc(d.bank?.name)}</strong>
        </div>

        <div class="row">
          <span>País</span>
          <strong>${esc(d.country?.name)}</strong>
        </div>

      </div>


      <div class="card">

        <div class="title">
          🍎 Apple Pay
        </div>

        <div class="row">

          <span>Compatibilidade conhecida</span>

          <strong>
            ${esc(applePay)}
          </strong>

        </div>

      </div>


      <div class="card">

        <div class="title">
          🔐 Método de verificação
        </div>

        <div class="methods">

          ${method(
            "💬",
            "SMS",
            sms,
            "Código enviado por mensagem"
          )}

          ${method(
            "📱",
            "Aplicativo",
            app,
            "Aprovação no aplicativo do emissor"
          )}

          ${method(
            "📞",
            "Ligação",
            phone,
            "Confirmação por telefone"
          )}

        </div>

        <div class="info">

          <strong>Fonte:</strong>
          ${esc(source)}

          <br><br>

          ⚠️ O método de verificação não é
          determinado somente pela BIN.

          Quando não houver confirmação,
          o resultado será mostrado como
          <strong>DESCONHECIDO</strong>.

        </div>

      </div>

    `;

  }catch(error){

    console.error(error);

    $("output").innerHTML = `

      <div class="card error">

        ❌ Não foi possível consultar essa BIN agora.

        <div class="info">

          A consulta pública da BIN não respondeu.
          Tente novamente em alguns instantes.

        </div>

      </div>

    `;

  }

}

$("go").addEventListener(
  "click",
  consult
);

$("bin").addEventListener(
  "keydown",
  e=>{
    if(e.key === "Enter"){
      consult();
    }
  }
);

</script>

</body>
</html>
