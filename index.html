<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Validador BIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;padding:24px 18px 40px}.logo{text-align:center;font-size:42px;margin:12px 0}
h1{text-align:center;margin:0 0 6px;font-size:28px}.sub{text-align:center;color:#94a3b8;margin-bottom:24px}
.box,.result{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;color:#cbd5e1;font-size:14px;margin-bottom:8px}
.form{display:flex;gap:9px}input{min-width:0;flex:1;border:0;border-radius:12px;padding:15px;font-size:18px;background:#0f172a;color:white;outline:none}
button{border:0;border-radius:12px;padding:0 17px;font-weight:700;background:#fff;color:#111827}
.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #334155}.row:last-child{border-bottom:0}
.row span{color:#94a3b8}.row strong{text-align:right}
.status{padding:14px;border-radius:13px;margin-top:15px;background:#334155}.status b{display:block;margin-bottom:7px}
.note{font-size:13px;color:#94a3b8;line-height:1.5;margin-top:15px}
.error{color:#fecaca}.small{font-size:12px;color:#64748b;margin-top:16px;text-align:center}
</style>
</head>
<body>
<main class="app">
<div class="logo">💳</div>
<h1>Validador de BIN</h1>
<div class="sub">Consulta informações públicas da BIN</div>

<section class="box">
<label for="bin">BIN do cartão</label>
<div class="form">
<input id="bin" inputmode="numeric" maxlength="8" placeholder="Ex.: 473270" autocomplete="off">
<button id="go">Consultar</button>
</div>
</section>

<section id="output"></section>
<div class="small">Não informe número completo, validade, CVV ou código SMS.</div>
</main>

<script>
const $=id=>document.getElementById(id);
function esc(v){return String(v??"Não informado").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function consult(){
  const bin=$("bin").value.replace(/\D/g,"");
  if(bin.length<6||bin.length>8){
    $("output").innerHTML='<div class="result error">Digite uma BIN com 6 a 8 números.</div>';return;
  }
  $("output").innerHTML='<div class="result">Consultando…</div>';
  try{
    const r=await fetch("https://lookup.binlist.net/"+encodeURIComponent(bin),{headers:{"Accept":"application/json"}});
    if(!r.ok) throw new Error();
    const d=await r.json();
    $("output").innerHTML=`
      <div class="result">
        <div class="row"><span>BIN</span><strong>${esc(bin)}</strong></div>
        <div class="row"><span>Bandeira</span><strong>${esc(d.scheme)}</strong></div>
        <div class="row"><span>Tipo</span><strong>${esc(d.type)}</strong></div>
        <div class="row"><span>Emissor</span><strong>${esc(d.bank?.name)}</strong></div>
        <div class="row"><span>País</span><strong>${esc(d.country?.name)}</strong></div>
        <div class="status">
          <b>Apple Wallet: método não determinável pela BIN</b>
          A BIN não informa de forma confiável se a verificação será por SMS,
          aplicativo do banco, ligação ou outro método. O método efetivamente
          oferecido depende do emissor e do cartão.
        </div>
        <div class="note">
          Para descobrir o método real, use um cartão seu e observe as opções
          apresentadas pelo próprio Wallet/emissor durante a adição.
        </div>
      </div>`;
  }catch(e){
    $("output").innerHTML='<div class="result error">Não foi possível consultar essa BIN agora. Tente novamente.</div>';
  }
}
$("go").addEventListener("click",consult);
$("bin").addEventListener("keydown",e=>{if(e.key==="Enter")consult()});
</script>
</body>
</html>
